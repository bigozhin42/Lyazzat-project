<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер задач сотрудников</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1a202c;
  --text-secondary: #64748b;
  --sidebar-bg: #1e293b;
  --sidebar-text: #cbd5e1;
  --sidebar-text-active: #ffffff;
  --sidebar-hover: #334155;
  --sidebar-active: #0f172a;
  --primary: #3b82f6;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --sidebar-bg: #0a0f1e;
  --sidebar-hover: #1e293b;
  --sidebar-active: #0f172a;
}

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
#sidebar { width: 240px; min-width: 240px; background: var(--sidebar-bg); display: flex; flex-direction: column; overflow-y: auto; }
.sidebar-logo { padding: 20px 16px; border-bottom: 1px solid #334155; font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; }
.sidebar-logo span { display: block; font-size: 11px; font-weight: 400; color: #64748b; margin-top: 2px; }
.sidebar-section { padding: 12px 0 4px; }
.sidebar-section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #475569; padding: 0 16px 6px; }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; color: var(--sidebar-text); font-size: 13.5px; transition: background .15s; }
.sidebar-item:hover { background: var(--sidebar-hover); }
.sidebar-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
.sidebar-item .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.avatar-sm { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; }
.red-dot { width: 7px; height: 7px; background: var(--danger); border-radius: 50%; margin-left: auto; flex-shrink: 0; }
.sidebar-add-btn { margin: 8px 16px; padding: 7px 12px; background: #334155; border: none; border-radius: 6px; color: #94a3b8; font-size: 12.5px; cursor: pointer; text-align: left; transition: background .15s; display: flex; align-items: center; gap: 6px; }
.sidebar-add-btn:hover { background: #475569; color: #fff; }
.sidebar-bottom { margin-top: auto; border-top: 1px solid #334155; padding: 8px 0; }

/* MAIN */
#main { flex: 1; overflow-y: auto; padding: 24px 32px; }
.page { display: none; }
.page.active { display: block; }

/* TOPBAR */
.topbar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
.theme-toggle { padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12.5px; color: var(--text-secondary); }

/* PAGE HEADER */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 700; }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; border: none; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: opacity .15s, background .15s; }
.btn:hover { opacity: .88; }
.btn-primary { background: var(--primary); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg); opacity: 1; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
.btn-icon { padding: 5px 8px; font-size: 14px; }

/* CARDS */
.cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.card-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.card-value { font-size: 30px; font-weight: 700; line-height: 1; }
.card-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* TABLE */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); background: var(--bg); }
td { padding: 11px 16px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--bg); }

/* BADGES */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-blue { background: #dbeafe; color: #1d4ed8; }
.badge-green { background: #dcfce7; color: #15803d; }
.badge-red { background: #fee2e2; color: #b91c1c; }
.badge-gray { background: #f1f5f9; color: #475569; }
.badge-amber { background: #fef3c7; color: #b45309; }
.badge-purple { background: #f3e8ff; color: #7e22ce; }
[data-theme="dark"] .badge-blue { background: #1e3a5f; color: #93c5fd; }
[data-theme="dark"] .badge-green { background: #14532d; color: #86efac; }
[data-theme="dark"] .badge-red { background: #450a0a; color: #fca5a5; }
[data-theme="dark"] .badge-gray { background: #1e293b; color: #94a3b8; }
[data-theme="dark"] .badge-amber { background: #451a03; color: #fde68a; }
[data-theme="dark"] .badge-purple { background: #2e1065; color: #d8b4fe; }

.risk-high { color: var(--danger); font-weight: 600; }
.risk-medium { color: var(--warning); font-weight: 600; }
.risk-low { color: var(--success); font-weight: 600; }

.tc { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; }
.tc-0 { background: #f1f5f9; color: #64748b; }
.tc-1 { background: #ffedd5; color: #ea580c; }
.tc-2 { background: #fed7aa; color: #c2410c; }
.tc-3 { background: #fee2e2; color: #b91c1c; }

.strike { text-decoration: line-through; color: var(--text-secondary); font-size: 12px; }
.date-red { color: var(--danger); font-weight: 500; }

/* EMPLOYEE HEADER */
.emp-header { display: flex; align-items: flex-start; gap: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 24px; }
.avatar-lg { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: white; flex-shrink: 0; }
.emp-name { font-size: 20px; font-weight: 700; }
.emp-role { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.emp-stats { display: flex; gap: 24px; margin-top: 10px; flex-wrap: wrap; }
.emp-stat { font-size: 13px; color: var(--text-secondary); }
.emp-stat strong { color: var(--text); font-weight: 600; }
.emp-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* CHECKLIST */
.cl-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.cl-date-label { font-size: 15px; font-weight: 600; min-width: 200px; text-align: center; }
.progress-wrap { background: var(--border); border-radius: 4px; height: 6px; margin-bottom: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
.progress-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
.cl-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
.cl-input-row input[type="text"] { flex: 1; }
.cl-input-row input[type="date"] { width: 140px; }
.cl-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
.cl-item.done { opacity: .5; }
.cl-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; accent-color: var(--primary); }
.cl-text { flex: 1; font-size: 13.5px; }
.cl-item.done .cl-text { text-decoration: line-through; color: var(--text-secondary); }
.cl-text[contenteditable]:focus { outline: none; border-bottom: 1.5px solid var(--primary); }
.cl-tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px; flex-shrink: 0; }
.cl-tag-transfer { background: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; }
.cl-tag-planned { background: #dbeafe; color: #1e40af; border-left: 3px solid #3b82f6; }
[data-theme="dark"] .cl-tag-transfer { background: #451a03; color: #fde68a; }
[data-theme="dark"] .cl-tag-planned { background: #1e3a5f; color: #93c5fd; }
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-secondary); margin: 14px 0 8px; }

/* MODALS */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 12px; padding: 28px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
.form-group { margin-bottom: 15px; }
.form-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); font-size: 13.5px; font-family: inherit; outline: none; transition: border-color .15s; }
input:focus, textarea:focus, select:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 68px; }
.color-picker { display: flex; gap: 10px; margin-top: 4px; }
.color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color .15s, transform .15s; }
.color-dot.selected { border-color: var(--text); transform: scale(1.15); }
.confirm-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
.empty { text-align: center; padding: 48px 24px; color: var(--text-secondary); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 14px; }

/* MOBILE */
.hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; color: var(--text); font-size: 22px; line-height: 1; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99; }
.sidebar-overlay.open { display: block; }

@media (max-width: 768px) {
  body { overflow: hidden; }

  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
    transform: translateX(-100%); transition: transform .25s ease;
    width: 260px; min-width: 0;
  }
  #sidebar.open { transform: translateX(0); }

  #main { padding: 16px; overflow-y: auto; }

  .topbar { justify-content: space-between; margin-bottom: 16px; }
  .hamburger { display: flex; }

  .page-header { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .page-title { font-size: 18px; }

  .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .card { padding: 14px; }
  .card-value { font-size: 24px; }

  .table-wrap { border-radius: 8px; overflow-x: auto; }
  table { min-width: 560px; }

  .emp-header { flex-wrap: wrap; gap: 14px; padding: 16px; }
  .emp-actions { width: 100%; margin-left: 0; justify-content: flex-start; }

  .cl-nav { flex-wrap: wrap; gap: 8px; }
  .cl-date-label { min-width: 0; flex: 1; font-size: 13px; }
  .cl-input-row { flex-wrap: wrap; }
  .cl-input-row input[type="date"] { width: 100%; }

  .modal { padding: 20px; }
}

@media (max-width: 420px) {
  .cards-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .emp-stats { gap: 12px; }
}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<nav id="sidebar">
  <div class="sidebar-logo">Трекер задач<span>Управление сотрудниками</span></div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Навигация</div>
    <div class="sidebar-item active" id="nav-analytics" onclick="showPage('analytics')">
      <span class="icon">📊</span> Аналитика
    </div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Сотрудники</div>
    <div id="sidebar-employees"></div>
    <button class="sidebar-add-btn" onclick="openAddEmployee()">＋ Добавить</button>
  </div>
  <div class="sidebar-bottom">
    <div class="sidebar-item" id="nav-checklist" onclick="showPage('checklist')">
      <span class="icon">✅</span> Я (чек-лист)
    </div>
  </div>
</nav>

<main id="main">
  <div class="topbar">
    <button class="hamburger" onclick="openSidebar()">☰</button>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Тема</button>
  </div>

  <!-- ANALYTICS -->
  <div class="page active" id="page-analytics">
    <div class="page-header">
      <div><div class="page-title">Аналитика</div><div class="page-subtitle">Общая картина по всем сотрудникам</div></div>
      <button class="btn btn-ghost" onclick="exportCSV()">📥 Экспорт CSV</button>
    </div>
    <div class="cards-grid" id="a-cards"></div>
    <div class="table-wrap">
      <div class="table-header">Соблюдение сроков</div>
      <table><thead><tr><th>Сотрудник</th><th>Задач</th><th>Важных</th><th>Операционных</th><th>Переносов</th><th>Оценка</th></tr></thead>
      <tbody id="a-tbody"></tbody></table>
    </div>
  </div>

  <!-- EMPLOYEE -->
  <div class="page" id="page-employee"><div id="emp-content"></div></div>

  <!-- CHECKLIST -->
  <div class="page" id="page-checklist">
    <div class="page-header"><div><div class="page-title">Мой чек-лист</div><div class="page-subtitle">Ежедневные задачи</div></div></div>
    <div class="cl-nav">
      <button class="btn btn-ghost btn-sm" onclick="clMove(-1)">← Назад</button>
      <div class="cl-date-label" id="cl-label"></div>
      <button class="btn btn-ghost btn-sm" onclick="clMove(1)">Вперёд →</button>
      <button class="btn btn-ghost btn-sm" onclick="clToday()">Сегодня</button>
    </div>
    <div class="table-wrap" style="padding:20px">
      <div class="cl-input-row">
        <input type="text" id="cl-input" placeholder="Добавить задачу..." onkeydown="if(event.key==='Enter')addClItem()">
        <input type="date" id="cl-due">
        <button class="btn btn-primary btn-sm" onclick="addClItem()">Добавить</button>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="cl-bar"></div></div>
      <div class="progress-label" id="cl-prog-label"></div>
      <div id="cl-todo"></div>
      <div id="cl-done"></div>
    </div>
  </div>
</main>

<!-- MODAL: Employee -->
<div class="modal-overlay" id="m-emp">
  <div class="modal">
    <div class="modal-title" id="m-emp-title">Добавить сотрудника</div>
    <div class="form-group"><label class="form-label">Имя и фамилия *</label><input type="text" id="f-emp-name" placeholder="Анна Петрова"></div>
    <div class="form-group"><label class="form-label">Должность / роль</label><input type="text" id="f-emp-role" placeholder="Менеджер"></div>
    <div class="form-group"><label class="form-label">Цвет аватара</label><div class="color-picker" id="color-picker"></div></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('m-emp')">Отмена</button>
      <button class="btn btn-primary" onclick="saveEmployee()">Сохранить</button>
    </div>
  </div>
</div>

<!-- MODAL: Task -->
<div class="modal-overlay" id="m-task">
  <div class="modal">
    <div class="modal-title" id="m-task-title">Добавить задачу</div>
    <div class="form-group"><label class="form-label">Название *</label><input type="text" id="f-t-name" placeholder="Название задачи"></div>
    <div class="form-group"><label class="form-label">Описание</label><textarea id="f-t-desc" placeholder="Описание..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Тип</label><select id="f-t-type"><option value="important">Важная</option><option value="ops">Операционка</option></select></div>
      <div class="form-group"><label class="form-label">Статус</label><select id="f-t-status"><option value="active">В работе</option><option value="done">Готово</option><option value="overdue">Просрочено</option><option value="paused">Пауза</option></select></div>
      <div class="form-group"><label class="form-label">Дата начала</label><input type="date" id="f-t-start"></div>
      <div class="form-group"><label class="form-label">Плановый срок *</label><input type="date" id="f-t-deadline"></div>
    </div>
    <div class="form-group"><label class="form-label">Заметки</label><textarea id="f-t-notes" placeholder="Заметки..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('m-task')">Отмена</button>
      <button class="btn btn-primary" onclick="saveTask()">Сохранить</button>
    </div>
  </div>
</div>

<!-- MODAL: Postpone -->
<div class="modal-overlay" id="m-post">
  <div class="modal" style="width:380px">
    <div class="modal-title">Перенести срок</div>
    <div class="form-group"><label class="form-label">Новая дата (не раньше текущей)</label><input type="date" id="f-post-date"></div>
    <div class="form-group"><label class="form-label">Причина переноса</label><textarea id="f-post-reason" placeholder="Укажите причину..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('m-post')">Отмена</button>
      <button class="btn btn-primary" onclick="doPostpone()">Перенести</button>
    </div>
  </div>
</div>

<!-- MODAL: Confirm -->
<div class="modal-overlay" id="m-confirm">
  <div class="modal" style="width:360px">
    <div class="modal-title" id="m-confirm-title">Подтверждение</div>
    <div class="confirm-text" id="m-confirm-text"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('m-confirm')">Отмена</button>
      <button class="btn btn-danger" onclick="doConfirm()">Удалить</button>
    </div>
  </div>
</div>

function fmtDate(s) { if(!s)return'—'; const[y,m,d]=s.split('-'); return`${d}.${m}.${y}`; }
function initials(n) { return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function days(a,b) { if(!a||!b)return'—'; return Math.round((new Date(b)-new Date(a))/86400000)+' д.'; }

const STATUS_L = {active:'В работе',done:'Готово',overdue:'Просрочено',paused:'Пауза'};
const STATUS_B = {active:'badge-blue',done:'badge-green',overdue:'badge-red',paused:'badge-gray'};
const TYPE_L = {important:'Важная',ops:'Операционка'};

function loadData() {
  try { const r=localStorage.getItem(KEY); if(r)return JSON.parse(r); } catch(e){}
  return defaultData();
}

function defaultData() {
  const t=today(), d=n=>{ const x=new Date(t); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
  return {
    employees:[
      { id:uid(), name:'Анна Петрова', role:'Менеджер проектов', colorIdx:0, tasks:[
        { id:uid(), name:'Подготовить отчёт Q2', desc:'Квартальный отчёт по продажам', type:'important', status:'done', start:d(-25), deadlines:[d(-10)], notes:'' },
        { id:uid(), name:'Обновить CRM базу', desc:'', type:'ops', status:'active', start:d(-5), deadlines:[d(3)], notes:'' },
        { id:uid(), name:'Встреча с клиентом', desc:'Обсуждение нового контракта', type:'important', status:'overdue', start:d(-15), deadlines:[d(-10),d(-3)], notes:'Перенос 1: клиент заболел' },
      ]},
      { id:uid(), name:'Дмитрий Волков', role:'Разработчик', colorIdx:2, tasks:[
        { id:uid(), name:'Интеграция с API', desc:'', type:'important', status:'active', start:d(-8), deadlines:[d(-3),d(2),d(7)], notes:'Перенос 1: зависимость от партнёра\nПеренос 2: баг в документации' },
        { id:uid(), name:'Code review', desc:'', type:'ops', status:'done', start:d(-3), deadlines:[d(1)], notes:'' },
      ]},
      { id:uid(), name:'Мария Соколова', role:'Дизайнер', colorIdx:4, tasks:[
        { id:uid(), name:'Макеты для лендинга', desc:'Figma-прототип', type:'important', status:'active', start:d(-6), deadlines:[d(4)], notes:'' },
      ]},
    ],
    checklist:[]
  };
}

let db = loadData();

// ── SIDEBAR MOBILE ──
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ── NAV ──
let curPage='analytics', curEmpId=null;

function showPage(page, empId) {
  closeSidebar();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  curPage=page;
  if(page==='employee' && empId) {
    curEmpId=empId;
    renderEmployee(empId);
    document.getElementById('page-employee').classList.add('active');
  } else if(page==='checklist') {
    document.getElementById('page-checklist').classList.add('active');
    document.getElementById('nav-checklist').classList.add('active');
    renderChecklist();
  } else {
    document.getElementById('page-analytics').classList.add('active');
    document.getElementById('nav-analytics').classList.add('active');
    renderAnalytics();
  }
  renderSidebar();
}

// ── SIDEBAR ──
function renderSidebar() {
  const emps=[...db.employees].sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('sidebar-employees').innerHTML = emps.map(e=>`
    <div class="sidebar-item${curEmpId===e.id&&curPage==='employee'?' active':''}" onclick="showPage('employee','${e.id}')">
      <div class="avatar-sm" style="background:${COLORS[e.colorIdx||0]}">${initials(e.name)}</div>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.name}</span>
      ${e.tasks.some(t=>t.deadlines.length>1)?'<span class="red-dot"></span>':''}
    </div>`).join('');
}

// ── RISK ──
function risk(emp) {
  const t=emp.tasks; if(!t.length) return {level:'low',label:'Нет задач',n:0};
  const n=t.reduce((s,x)=>s+Math.max(0,x.deadlines.length-1),0);
  const p=t.filter(x=>x.deadlines.length>1).length/t.length;
  if(p>=.6||n>=3) return {level:'high',label:'Часто нарушает сроки',n};
  if(p>=.3||n>=2) return {level:'medium',label:'Иногда нарушает',n};
  return {level:'low',label:'Соблюдает сроки',n};
}

// ── ANALYTICS ──
function renderAnalytics() {
  const all=db.employees.flatMap(e=>e.tasks);
  const tot=all.length, imp=all.filter(t=>t.type==='important').length;
  const ops=all.filter(t=>t.type==='ops').length, wt=all.filter(t=>t.deadlines.length>1).length;
  const pct=n=>tot?Math.round(n/tot*100):0;
  document.getElementById('a-cards').innerHTML=`
    <div class="card"><div class="card-label">Всего задач</div><div class="card-value">${tot}</div><div class="card-sub">${db.employees.length} сотрудников</div></div>
    <div class="card"><div class="card-label">Важные задачи</div><div class="card-value">${imp}</div><div class="card-sub">${pct(imp)}% от всех</div></div>
    <div class="card"><div class="card-label">Операционные</div><div class="card-value">${ops}</div><div class="card-sub">${pct(ops)}% от всех</div></div>
    <div class="card"><div class="card-label">С переносами</div><div class="card-value">${wt}</div><div class="card-sub">${pct(wt)}% от всех</div></div>`;

  const sorted=[...db.employees].sort((a,b)=>{
    const o={high:0,medium:1,low:2};
    return o[risk(a).level]-o[risk(b).level];
  });
  const icon={high:'🔴',medium:'🟡',low:'🟢'};
  document.getElementById('a-tbody').innerHTML = sorted.length ? sorted.map(e=>{
    const r=risk(e), t=e.tasks;
    return `<tr onclick="showPage('employee','${e.id}')">
      <td><div style="display:flex;align-items:center;gap:10px">
        <div class="avatar-sm" style="background:${COLORS[e.colorIdx||0]}">${initials(e.name)}</div>
        <div><div style="font-weight:500">${e.name}</div><div style="font-size:11px;color:var(--text-secondary)">${e.role||'—'}</div></div>
      </div></td>
      <td>${t.length}</td>
      <td>${t.filter(x=>x.type==='important').length}</td>
      <td>${t.filter(x=>x.type==='ops').length}</td>
      <td>${r.n}</td>
      <td><span class="risk-${r.level}">${icon[r.level]} ${r.label}</span></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty"><div class="empty-icon">👥</div><div class="empty-text">Нет сотрудников</div></div></td></tr>`;
}

// ── EMPLOYEE ──
function renderEmployee(eid) {
  const emp=db.employees.find(e=>e.id===eid); if(!emp){showPage('analytics');return;}
  const t=emp.tasks, imp=t.filter(x=>x.type==='important').length, ops=t.filter(x=>x.type==='ops').length;
  const transfers=t.reduce((s,x)=>s+Math.max(0,x.deadlines.length-1),0);
  const tcCls=n=>n===0?'tc-0':n===1?'tc-1':n===2?'tc-2':'tc-3';
  const rows=t.length ? t.map(task=>{
    const orig=task.deadlines[0], curr=task.deadlines[task.deadlines.length-1], tc=task.deadlines.length-1;
    return `<tr>
      <td><div style="font-weight:500">${task.name}</div>${task.desc?`<div style="font-size:11px;color:var(--text-secondary)">${task.desc}</div>`:''}</td>
      <td><span class="badge ${task.type==='important'?'badge-purple':'badge-blue'}">${TYPE_L[task.type]}</span></td>
      <td><span class="badge ${STATUS_B[task.status]}">${STATUS_L[task.status]}</span></td>
      <td>${fmtDate(task.start)}</td>
      <td>${tc>0
        ? task.deadlines.slice(0,-1).map((d,i)=>`<span class="strike" style="display:block;font-size:11px;color:var(--text-secondary)">${i===0?'':'↓ '}${fmtDate(d)}</span>`).join('')
        : fmtDate(orig)}</td>
      <td><span class="tc ${tcCls(tc)}">${tc}</span></td>
      <td>${tc>0?`<span class="date-red">${fmtDate(curr)}</span>`:fmtDate(curr)}</td>
      <td>${days(task.start,curr)}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-icon btn-sm" title="Перенести срок" onclick="event.stopPropagation();openPostpone('${eid}','${task.id}')">📅</button>
        <button class="btn btn-ghost btn-icon btn-sm" title="Редактировать" onclick="event.stopPropagation();openEditTask('${eid}','${task.id}')">✏️</button>
        <button class="btn btn-ghost btn-icon btn-sm" title="Удалить" onclick="event.stopPropagation();askConfirm('task','${eid}','${task.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="9"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Нет задач. Нажмите «＋ Задача» чтобы добавить.</div></div></td></tr>`;

  document.getElementById('emp-content').innerHTML=`
    <div class="emp-header">
      <div class="avatar-lg" style="background:${COLORS[emp.colorIdx||0]}">${initials(emp.name)}</div>
      <div>
        <div class="emp-name">${emp.name}</div>
        <div class="emp-role">${emp.role||'—'}</div>
        <div class="emp-stats">
          <span class="emp-stat">Задач: <strong>${t.length}</strong></span>
          <span class="emp-stat">Важных: <strong>${imp}</strong></span>
          <span class="emp-stat">Операционных: <strong>${ops}</strong></span>
          <span class="emp-stat">Переносов: <strong>${transfers}</strong></span>
        </div>
      </div>
      <div class="emp-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditEmployee('${eid}')">✏️ Редактировать</button>
        <button class="btn btn-ghost btn-sm" onclick="askConfirm('emp','${eid}')">🗑️ Удалить</button>
        <button class="btn btn-primary btn-sm" onclick="openAddTask('${eid}')">＋ Задача</button>
      </div>
    </div>
    <div class="cards-grid">
      <div class="card"><div class="card-label">Всего задач</div><div class="card-value">${t.length}</div></div>
      <div class="card"><div class="card-label">Важные</div><div class="card-value">${imp}</div><div class="card-sub">${t.length?Math.round(imp/t.length*100):0}%</div></div>
      <div class="card"><div class="card-label">Операционные</div><div class="card-value">${ops}</div><div class="card-sub">${t.length?Math.round(ops/t.length*100):0}%</div></div>
      <div class="card"><div class="card-label">Переносов</div><div class="card-value">${transfers}</div><div class="card-sub">${t.filter(x=>x.deadlines.length>1).length} задач</div></div>
    </div>
    <div class="table-wrap">
      <div class="table-header">Задачи <button class="btn btn-primary btn-sm" onclick="openAddTask('${eid}')">＋ Добавить</button></div>
      <table><thead><tr><th>Задача</th><th>Тип</th><th>Статус</th><th>Начало</th><th>Исходный срок</th><th>Переносов</th><th>Текущий срок</th><th>Длительность</th><th>Действия</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
}

// ── CHECKLIST ──
let clDate=today();

function clMove(n) { const d=new Date(clDate); d.setDate(d.getDate()+n); clDate=d.toISOString().slice(0,10); renderChecklist(); }
function clToday() { clDate=today(); renderChecklist(); }

function getClItems(date) {
  return db.checklist.filter(item=>{
    if(item.dueDate) return item.dueDate===date;
    if(item.done) return item.doneDate===date;
    return item.createdDate<=date;
  });
}

function renderChecklist() {
  const d=new Date(clDate);
  document.getElementById('cl-label').textContent = d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}).replace(/^\w/,c=>c.toUpperCase());
  document.getElementById('cl-due').value=clDate;
  const items=getClItems(clDate), done=items.filter(i=>i.done), todo=items.filter(i=>!i.done);
  const pct=items.length?Math.round(done.length/items.length*100):0;
  document.getElementById('cl-bar').style.width=pct+'%';
  document.getElementById('cl-prog-label').textContent=`${done.length} из ${items.length} выполнено`;

  const render=item=>{
    let tag='';
    if(item.dueDate&&item.createdDate!==item.dueDate) tag=`<span class="cl-tag cl-tag-planned">запланировано</span>`;
    else if(!item.dueDate&&item.createdDate<clDate) tag=`<span class="cl-tag cl-tag-transfer">перенос</span>`;
    return `<div class="cl-item${item.done?' done':''}">
      <input type="checkbox" ${item.done?'checked':''} onchange="toggleCl('${item.id}')">
      <span class="cl-text" contenteditable="true" onblur="saveCl('${item.id}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${item.text}</span>${tag}
      <button class="btn btn-ghost btn-icon btn-sm" onclick="deleteCl('${item.id}')" title="Удалить" style="padding:3px 6px;font-size:16px;line-height:1">×</button>
    </div>`;
  };

  document.getElementById('cl-todo').innerHTML = todo.length
    ? `<div class="section-label">К выполнению</div>`+todo.map(render).join('')
    : items.length ? '' : `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Добавьте первую задачу на этот день</div></div>`;
  document.getElementById('cl-done').innerHTML = done.length
    ? `<div class="section-label">Выполнено</div>`+done.map(render).join('') : '';
}

function addClItem() {
  const text=document.getElementById('cl-input').value.trim(); if(!text)return;
  const due=document.getElementById('cl-due').value;
  db.checklist.push({id:uid(),text,done:false,createdDate:clDate,dueDate:due!==clDate?due:null});
  save(); document.getElementById('cl-input').value=''; document.getElementById('cl-due').value=clDate; renderChecklist();
}
function saveCl(id, el) {
  const text = el.textContent.trim();
  if (!text) { el.textContent = db.checklist.find(x=>x.id===id)?.text || ''; return; }
  const item = db.checklist.find(x=>x.id===id);
  if (item) { item.text = text; save(); }
}
function toggleCl(id) {
  const i=db.checklist.find(x=>x.id===id); if(!i)return;
  i.done=!i.done; i.doneDate=i.done?clDate:null; save(); renderChecklist();
}
function deleteCl(id) { db.checklist=db.checklist.filter(x=>x.id!==id); save(); renderChecklist(); }

// ── EMPLOYEE MODAL ──
let editEmpId=null, selColor=0;

function openAddEmployee() {
  editEmpId=null; selColor=0;
  document.getElementById('m-emp-title').textContent='Добавить сотрудника';
  document.getElementById('f-emp-name').value=''; document.getElementById('f-emp-role').value='';
  renderColorPicker(); openModal('m-emp');
}
function openEditEmployee(eid) {
  const e=db.employees.find(x=>x.id===eid); if(!e)return;
  editEmpId=eid; selColor=e.colorIdx||0;
  document.getElementById('m-emp-title').textContent='Редактировать сотрудника';
  document.getElementById('f-emp-name').value=e.name; document.getElementById('f-emp-role').value=e.role||'';
  renderColorPicker(); openModal('m-emp');
}
function renderColorPicker() {
  document.getElementById('color-picker').innerHTML=COLORS.map((c,i)=>
    `<div class="color-dot${i===selColor?' selected':''}" style="background:${c}" onclick="selColor=${i};renderColorPicker()"></div>`).join('');
}
function saveEmployee() {
  const name=document.getElementById('f-emp-name').value.trim(); if(!name){document.getElementById('f-emp-name').focus();return;}
  const role=document.getElementById('f-emp-role').value.trim();
  if(editEmpId) { const e=db.employees.find(x=>x.id===editEmpId); e.name=name; e.role=role; e.colorIdx=selColor; }
  else db.employees.push({id:uid(),name,role,colorIdx:selColor,tasks:[]});
  save(); closeModal('m-emp'); renderSidebar();
  if(editEmpId&&curPage==='employee') renderEmployee(editEmpId);
  if(curPage==='analytics') renderAnalytics();
}

// ── TASK MODAL ──
let editTaskId=null, editTaskEmpId=null;

function openAddTask(eid) {
  editTaskId=null; editTaskEmpId=eid;
  document.getElementById('m-task-title').textContent='Добавить задачу';
  ['f-t-name','f-t-desc','f-t-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-t-type').value='important'; document.getElementById('f-t-status').value='active';
  document.getElementById('f-t-start').value=today(); document.getElementById('f-t-deadline').value='';
  openModal('m-task');
}
function openEditTask(eid,tid) {
  const e=db.employees.find(x=>x.id===eid), t=e?.tasks.find(x=>x.id===tid); if(!t)return;
  editTaskId=tid; editTaskEmpId=eid;
  document.getElementById('m-task-title').textContent='Редактировать задачу';
  document.getElementById('f-t-name').value=t.name; document.getElementById('f-t-desc').value=t.desc||'';
  document.getElementById('f-t-type').value=t.type; document.getElementById('f-t-status').value=t.status;
  document.getElementById('f-t-start').value=t.start||''; document.getElementById('f-t-deadline').value=t.deadlines[t.deadlines.length-1]||'';
  document.getElementById('f-t-notes').value=t.notes||'';
  openModal('m-task');
}
function saveTask() {
  const name=document.getElementById('f-t-name').value.trim(), deadline=document.getElementById('f-t-deadline').value;
  if(!name){document.getElementById('f-t-name').focus();return;} if(!deadline){document.getElementById('f-t-deadline').focus();return;}
  const e=db.employees.find(x=>x.id===editTaskEmpId); if(!e)return;
  const data={name,desc:document.getElementById('f-t-desc').value.trim(),type:document.getElementById('f-t-type').value,
    status:document.getElementById('f-t-status').value,start:document.getElementById('f-t-start').value,notes:document.getElementById('f-t-notes').value.trim()};
  if(editTaskId) { const t=e.tasks.find(x=>x.id===editTaskId); Object.assign(t,data); t.deadlines[t.deadlines.length-1]=deadline; }
  else e.tasks.push({id:uid(),...data,deadlines:[deadline]});
  save(); closeModal('m-task'); renderEmployee(editTaskEmpId); renderSidebar();
}

// ── POSTPONE ──
let postEmpId=null, postTaskId=null;

function openPostpone(eid,tid) {
  const e=db.employees.find(x=>x.id===eid), t=e?.tasks.find(x=>x.id===tid); if(!t)return;
  postEmpId=eid; postTaskId=tid;
  const curr=t.deadlines[t.deadlines.length-1];
  document.getElementById('f-post-date').value=curr; document.getElementById('f-post-date').min=curr;
  document.getElementById('f-post-reason').value=''; openModal('m-post');
}
function doPostpone() {
  const newDate=document.getElementById('f-post-date').value, reason=document.getElementById('f-post-reason').value.trim();
  const e=db.employees.find(x=>x.id===postEmpId), t=e?.tasks.find(x=>x.id===postTaskId); if(!t||!newDate)return;
  const curr=t.deadlines[t.deadlines.length-1];
  if(newDate<=curr){alert('Новая дата должна быть позже текущей');return;}
  t.deadlines.push(newDate);
  if(reason) t.notes=(t.notes?t.notes+'\n':'')+`Перенос ${t.deadlines.length-1}: ${reason}`;
  save(); closeModal('m-post'); renderEmployee(postEmpId); renderSidebar();
}

// ── CONFIRM ──
let confirmFn=null;
function askConfirm(type,...args) {
  if(type==='emp') {
    const e=db.employees.find(x=>x.id===args[0]);
    document.getElementById('m-confirm-title').textContent='Удалить сотрудника?';
    document.getElementById('m-confirm-text').textContent=`Сотрудник «${e?.name}» и все его задачи будут удалены.`;
    confirmFn=()=>{ db.employees=db.employees.filter(x=>x.id!==args[0]); save(); closeModal('m-confirm'); curEmpId=null; showPage('analytics'); };
  } else {
    const e=db.employees.find(x=>x.id===args[0]), t=e?.tasks.find(x=>x.id===args[1]);
    document.getElementById('m-confirm-title').textContent='Удалить задачу?';
    document.getElementById('m-confirm-text').textContent=`Задача «${t?.name}» будет удалена без возможности восстановления.`;
    confirmFn=()=>{ e.tasks=e.tasks.filter(x=>x.id!==args[1]); save(); closeModal('m-confirm'); renderEmployee(args[0]); renderSidebar(); };
  }
  openModal('m-confirm');
}
function doConfirm() { if(confirmFn)confirmFn(); }

// ── CSV ──
function exportCSV() {
  const BOM='﻿', rows=[['Сотрудник','Роль','Задача','Тип','Статус','Начало','Исходный срок','Переносов','Текущий срок']];
  db.employees.forEach(e=>e.tasks.forEach(t=>rows.push([e.name,e.role||'',t.name,TYPE_L[t.type],STATUS_L[t.status],t.start||'',t.deadlines[0]||'',t.deadlines.length-1,t.deadlines[t.deadlines.length-1]||''])));
  const csv=BOM+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='tasks.csv'; a.click();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(el=>el.addEventListener('click',e=>{ if(e.target===el)el.classList.remove('open'); }));

// ── THEME ──
function toggleTheme() {
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
  document.querySelector('.theme-toggle').textContent=html.dataset.theme==='dark'?'☀️ Тема':'🌙 Тема';
  localStorage.setItem('tt4_theme',html.dataset.theme);
}
const th=localStorage.getItem('tt4_theme');
if(th){ document.documentElement.dataset.theme=th; if(th==='dark')document.querySelector('.theme-toggle').textContent='☀️ Тема'; }

// ── INIT ──
renderSidebar();
renderAnalytics();
